name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python export-source.py --check
      - run: sha256sum --check --quiet SOURCE-SHA256.txt
  native-launcher:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: ./build-launcher.sh
  account-helper:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 bootstrap-sources.py --project xodus
      - run: command -v protoc || brew install protobuf
      - run: rustup toolchain install 1.98.0 --profile minimal
      - run: |
          mkdir -p sources/xodus/crates/xodus-cli/examples
          cp standalone-helper.rs sources/xodus/crates/xodus-cli/examples/standalone_helper.rs
          cargo +1.98.0 test --locked --manifest-path sources/xodus/Cargo.toml -p xodus-cli --example standalone_helper
