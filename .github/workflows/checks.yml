name: Source checks
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python tools/export-source.py --check
      - run: sha256sum --check --quiet SOURCE-SHA256.txt
  native-launcher:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Inspect selected Apple toolchain
        run: |
          xcode-select -p
          /usr/bin/xcrun --sdk macosx --toolchain default swiftc --version
          /usr/bin/xcrun --sdk macosx --toolchain default --show-sdk-path
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: ./tools/build-launcher.sh
      - run: python3 tests/check-launcher-lifecycle.py --output build/launcher-lifecycle-check
        timeout-minutes: 5
  account-helper:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 tools/bootstrap-sources.py --project xodus
      - run: command -v protoc || brew install protobuf
      - run: rustup toolchain install 1.98.0 --profile minimal
      # Run only these offline loopback fixtures; other upstream library tests
      # can contact Microsoft or use Keychain and must not run implicitly.
      - run: cargo +1.98.0 test --locked --jobs 2 --manifest-path sources/xodus/Cargo.toml -p xodus --lib api::xbox::auth::tests -- --test-threads=1
      # bootstrap-sources copies the helper, verifier and pinned public key.
      # Match the feature set used by client/standalone-setup.py for the shipped helper.
      - run: cargo +1.98.0 test --locked --no-default-features --manifest-path sources/xodus/Cargo.toml -p xodus-cli --example standalone_helper
  file-pickers:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and test picker ABI with the Windows SDK
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "BEDROCK_VS=%%i"
          if not defined BEDROCK_VS exit /b 1
          call "%BEDROCK_VS%\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          call native\file-pickers\check-windows.cmd
