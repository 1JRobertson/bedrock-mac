name: Bug report
description: Report a setup or gameplay problem.
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include what you expected and the last setup stage you saw. Remove personal information.
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac model, chip, memory, and macOS version
      placeholder: MacBook Air M1, 8 GB, macOS 15.3.1
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version or source commit
    validations:
      required: true
  - type: input
    id: game_version
    attributes:
      label: Minecraft version
      description: Copy the version shown in Minecraft, or say setup never reached the game.
  - type: input
    id: artifact
    attributes:
      label: DMG SHA-256 or build source
      description: If known; this distinguishes locally rebuilt apps with the same display version.
  - type: dropdown
    id: install
    attributes:
      label: Installation state
      options:
        - First installation
        - Retrying setup
        - Updating an existing app
        - Returning to play
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Do not attach passwords, tokens, account details, or complete unreviewed logs.
