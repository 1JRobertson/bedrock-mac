name: Bug report
description: Report a setup or gameplay problem.
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include what you expected and the last setup stage you saw. Remove personal information.
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac chip and macOS version
      placeholder: M4 Pro, macOS 26.6
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version or source commit
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation state
      options:
        - First installation
        - Retrying setup
        - Updating an existing app
        - Returning to play
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Do not attach passwords, tokens, account details, or complete unreviewed logs.
